<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Development Quest — HTML, CSS & JavaScript</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4fa;color:#202337;font:16px/1.6 system-ui}.shell{max-width:1100px;margin:auto;padding:24px 28px 12px}.shell h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.2}.tabs{display:flex;flex-wrap:wrap;gap:10px}button{font:inherit;cursor:pointer;padding:10px 20px;border:1px solid #6445c0;background:white;color:#6445c0;border-radius:12px}button[aria-pressed="true"]{background:#6445c0;color:white}iframe{display:block;width:100%;border:0;min-height:600px}button:focus-visible{outline:3px solid orange;outline-offset:3px}.hint{color:#655d73} @media print{.tabs,.hint{display:none}}</style></head><body><div class="shell"><p>🐉 THE COMPLETE DRAGON ACADEMY COLLECTION</p><h1>One academy. Three superpowers.</h1><p><strong>HTML</strong> builds it. <strong>CSS</strong> styles it. <strong>JavaScript</strong> brings it to life.</p><div class="tabs" aria-label="Choose a guide"><button type="button" data-guide="0" aria-pressed="true">HTML · Structure</button><button type="button" data-guide="1" aria-pressed="false">CSS · Style</button><button type="button" data-guide="2" aria-pressed="false">JavaScript · Behavior</button></div><p class="hint">All three complete guides are embedded in this file and work offline. Switching guides restarts their examples.</p></div><iframe id="book" title="HTML study guide"></iframe><script>
const books=["\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>HTML Quest — Complete Study Guide\u003c/title>\n\u003cstyle>\n:root{color-scheme:light;--ink:#202337;--accent:#6445c0}*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,sans-serif;color:var(--ink);background:#f5f4fa}header,main,footer{max-width:1050px;margin:auto;padding:28px}header{padding-top:48px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15}h2{margin-top:0}h3{margin-bottom:8px}a{color:var(--accent)}nav{display:flex;flex-wrap:wrap;gap:8px}nav a{padding:5px 12px;background:white;border-radius:20px;text-decoration:none}section{background:white;padding:26px;margin:0 0 24px;border-radius:16px;box-shadow:0 3px 16px #24204008}article{border-top:1px solid #e7e4ef;padding:16px 0}article:first-of-type{border:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}pre{background:#202337;color:#f1eaff;padding:16px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}code{font-family:Consolas,monospace}p code,li code{background:#f0edf8;padding:2px 5px;border-radius:4px}.result{padding:16px;border:1px solid #e0dbea;border-radius:10px;min-width:0}.label{font-size:.75rem;letter-spacing:.09em;font-weight:700;color:#756b89;margin:8px 0}.note{background:#f2eefa;padding:12px 16px;border-left:4px solid var(--accent)}input,select,textarea,button{font:inherit;max-width:100%}button{cursor:pointer}table{border-collapse:collapse}td,th{border:1px solid #bdb5cc;padding:8px;text-align:left}svg{max-width:100%}iframe{width:100%;border:1px solid #ddd}img{max-width:100%;height:auto}summary{cursor:pointer;font-weight:600}footer{color:#655d73}@media(max-width:650px){.pair{grid-template-columns:1fr}header,main,footer{padding:18px}section{padding:18px}}@media print{body{background:white}section{box-shadow:none;break-inside:avoid}nav{display:none}pre{background:#f3f3f3;color:black}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003cp>🐉 LEARN BY EXAMPLE\u003c/p>\u003ch1>HTML Quest: the complete guide\u003c/h1>\u003cp>Build Dragon Academy one tag at a time. Every topic includes a plain-language explanation and an example. Most examples also show the browser result.\u003c/p>\u003cp>\u003cstrong>Start here:\u003c/strong> \u003ccode>&lt;p&gt;Hello&lt;/p&gt;\u003c/code> has an opening tag, content, and a closing tag. Attributes add details: \u003ccode>&lt;a href=\"courses.html\"&gt;Courses&lt;/a&gt;\u003c/code>. Void elements such as \u003ccode>img\u003c/code>, \u003ccode>input\u003c/code>, \u003ccode>br\u003c/code>, and \u003ccode>meta\u003c/code> have no closing tag.\u003c/p>\u003cnav id=\"contents\" aria-label=\"Contents\">\u003c/nav>\u003c/header>\n\u003cmain id=\"guide\">\u003c/main>\u003cfooter>HTML describes meaning and structure. CSS controls appearance. JavaScript adds behavior. Save this file and open it in any modern browser — no installation required.\u003c/footer>\n\u003cscript>\nconst groups=[\n['Building the academy 🏰','Document structure',[\n['html','The root element wraps the whole document. lang identifies its language.','\u003chtml lang=\"en\">\\n  \u003chead>\u003ctitle>Dragon Academy\u003c/title>\u003c/head>\\n  \u003cbody>Welcome!\u003c/body>\\n\u003c/html>',false],\n['head','Holds information about the page and resource references, rather than its main visible content.','\u003chead>\\n  \u003cmeta charset=\"UTF-8\">\\n  \u003ctitle>Dragon Academy\u003c/title>\\n\u003c/head>',false],\n['title','Names the browser tab. It is different from a visible h1 heading.','\u003ctitle>Dragon Academy | Home\u003c/title>',false],\n['body','Contains the document content visitors see and interact with.','\u003cbody>\\n  \u003ch1>Welcome, trainer!\u003c/h1>\\n  \u003cp>Your adventure begins.\u003c/p>\\n\u003c/body>',false],\n['meta','Provides metadata. charset sets character encoding; viewport helps mobile layouts use the device width.','\u003cmeta charset=\"UTF-8\">\\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">',false],\n['link','References an external resource. This example loads a separate CSS stylesheet.','\u003clink rel=\"stylesheet\" href=\"academy.css\">',false],\n['style','Contains CSS rules inside the HTML document. Usually placed in head.','\u003cstyle>\\n  .dragon-name { color: purple; }\\n\u003c/style>\\n\u003cp class=\"dragon-name\">Chilli the Dragon\u003c/p>',false],\n['script','Runs JavaScript or loads an external JavaScript file. defer on an external classic script delays execution until HTML parsing finishes.','\u003cscript src=\"academy.js\" defer>\u003c\\/script>',false]\n]],\n['Make an announcement 📢','Headings and content',[\n['h1–h6','Six heading levels organize content, from the highest-level h1 to the deepest h6. Choose the level for hierarchy, not font size.','\u003ch1>Dragon Academy\u003c/h1>\\n\u003ch2>Courses\u003c/h2>\\n\u003ch3>Flying\u003c/h3>\\n\u003ch4>Beginner Flying\u003c/h4>\\n\u003ch5>Lesson One\u003c/h5>\\n\u003ch6>Instructor Notes\u003c/h6>'],\n['p','A paragraph groups a block of related text.','\u003cp>Your dragon lesson starts today.\u003c/p>'],\n['br','A line break within content. Use CSS for spacing instead of repeated br tags.','\u003cp>Bring a helmet.\u003cbr>And a fire extinguisher.\u003c/p>'],\n['hr','A thematic break between topics, usually displayed as a horizontal line.','\u003cp>Flying lesson complete.\u003c/p>\u003chr>\u003cp>Next: fire safety.\u003c/p>'],\n['div','A generic container for grouping content. It is block-level by default and has no special semantic meaning.','\u003cdiv>\u003ch3>Dragon Profile\u003c/h3>\u003cp>Name: Chilli\u003c/p>\u003c/div>'],\n['span','A generic inline container for a small piece of content, useful for styling text.','\u003cp>Meet \u003cspan style=\"color:purple\">Chilli\u003c/span>.\u003c/p>']\n]],\n['Give words meaning 🎭','Logical text tags',[\n['strong','Marks strong importance, seriousness, or urgency. Usually bold.','\u003cp>\u003cstrong>Warning:\u003c/strong> Dragon approaching!\u003c/p>'],\n['em','Marks stress emphasis. Usually italic.','\u003cp>I said \u003cem>feed\u003c/em> the dragon.\u003c/p>'],\n['mark','Highlights text relevant to the current context, like a search match.','\u003cp>Find the \u003cmark>golden key\u003c/mark>.\u003c/p>'],\n['small','Represents side comments or small print, not simply any text you want smaller.','\u003csmall>Helmet not included.\u003c/small>'],\n['del','Marks text deleted from the document. Usually struck through.','\u003cp>Lesson: \u003cdel>8 AM\u003c/del>\u003c/p>'],\n['ins','Marks text added to the document. Usually underlined.','\u003cp>New lesson time: \u003cins>9 AM\u003c/ins>\u003c/p>'],\n['sub','Subscript, for conventions such as chemical formulas.','\u003cp>Bring H\u003csub>2\u003c/sub>O.\u003c/p>'],\n['sup','Superscript, for conventions such as powers or footnote markers.','\u003cp>10\u003csup>2\u003c/sup> = 100\u003c/p>'],\n['abbr','Identifies an abbreviation. title can provide its full expansion; do not rely on hovering alone to explain essential information.','\u003cabbr title=\"Dragon Training Academy\">DTA\u003c/abbr>'],\n['cite','Identifies the title of a creative work, such as a book or movie; it is not for the author’s name.','\u003cp>Read \u003ccite>The Dragon Handbook\u003c/cite>.\u003c/p>'],\n['q','A short inline quotation. Browsers normally supply quotation marks.','\u003cp>The trainer said, \u003cq>Trust your wings.\u003c/q>\u003c/p>'],\n['blockquote','A separate block of quoted content. Its cite attribute can hold a source URL but does not display an attribution.','\u003cblockquote>\u003cp>Every expert was once a beginner.\u003c/p>\u003c/blockquote>'],\n['code','Identifies a fragment of computer code. It does not execute it.','\u003cp>Call \u003ccode>dragon.fly()\u003c/code>.\u003c/p>'],\n['pre','Preserves spaces and line breaks. Combine it with code for multiline code samples.','\u003cpre>\u003ccode>dragon.feed();\\n  dragon.fly();\\ndragon.sleep();\u003c/code>\u003c/pre>'],\n['address','Contact information for the author or owner of the page or nearest article. Not a tag for every postal address.','\u003caddress>Trainer: \u003ca href=\"mailto:trainer@example.com\">Email me\u003c/a>\u003c/address>']\n]],\n['Dress up your words 👔','Presentational text tags',[\n['b','Draws attention without adding strong importance; usually bold. Use strong when importance is intended.','\u003cp>\u003cb>Featured dragon:\u003c/b> Chilli\u003c/p>'],\n['i','Marks an alternate voice or kind of text, such as a technical term; usually italic. Use em for stress emphasis.','\u003cp>Scientific name: \u003ci>Draco magnificus\u003c/i> (fictional).\u003c/p>'],\n['u','Marks a non-textual annotation, such as a spelling error. Usually underlined; avoid confusing it with links.','\u003cp>Spelling error: \u003cu>dragonn\u003c/u>\u003c/p>'],\n['small','Also appears in formatting lists because browsers usually render it smaller. Its meaning remains side comments or small print.','\u003csmall>Terms apply to all dragon riders.\u003c/small>'],\n['strike — obsolete','Historical strikethrough element; do not use in new HTML. Use del for deleted content, or s for information no longer accurate.','\u003c!-- Old: \u003cstrike>Tickets available\u003c/strike> -->\\n\u003cp>\u003cs>Tickets available\u003c/s> Sold out!\u003c/p>']\n]],\n['Pack your adventure bag 🎒','Lists',[\n['ul + li','ul creates an unordered list; li is an individual list item. Use it when sequence does not matter.','\u003cul>\\n  \u003cli>Helmet\u003c/li>\\n  \u003cli>Shield\u003c/li>\\n  \u003cli>Snacks\u003c/li>\\n\u003c/ul>'],\n['ol + li','ol creates an ordered list; each li is a step or item whose order matters.','\u003col>\\n  \u003cli>Wear your helmet.\u003c/li>\\n  \u003cli>Mount your dragon.\u003c/li>\\n  \u003cli>Hold on!\u003c/li>\\n\u003c/ol>'],\n['dl + dt + dd','dl is a description list. dt is a term or name; dd gives its description or value.','\u003cdl>\\n  \u003cdt>Fire Dragon\u003c/dt>\\n  \u003cdd>Your enthusiastic barbecue assistant.\u003c/dd>\\n  \u003cdt>Ice Dragon\u003c/dt>\\n  \u003cdd>Keeps your drinks cold.\u003c/dd>\\n\u003c/dl>']\n]],\n['Open a portal 🔗','Links and navigation',[\n['a','Creates a hyperlink when href is supplied. It can point to another page, a section ID, or an email address.','\u003ca href=\"#top\">Back to the top\u003c/a>\\n\u003ca href=\"mailto:trainer@example.com\">Email trainer\u003c/a>'],\n['nav','Groups major navigation links. Not every small collection of links needs nav.','\u003cnav aria-label=\"Academy navigation\">\\n  \u003ca href=\"#topic-4\">Supplies\u003c/a>\\n  \u003ca href=\"#topic-10\">Leaderboard\u003c/a>\\n\u003c/nav>']\n]],\n['Show off your dragon 📸','Images and figures',[\n['img','Embeds an image. src gives its location; alt supplies a text alternative. Decorative images should use alt=\"\". width and height help reserve space.','\u003cimg src=\"dragon.jpg\" alt=\"A red dragon sleeping beside a tree\" width=\"400\" height=\"300\">',false],\n['figure + figcaption','figure groups self-contained content; figcaption supplies its caption. Figures can contain images, diagrams, or code, not just photos.','\u003cfigure>\\n  \u003cspan role=\"img\" aria-label=\"Mountain\">⛰️\u003c/span>\\n  \u003cfigcaption>Chilli’s mountain home.\u003c/figcaption>\\n\u003c/figure>']\n]],\n['Give your page rooms 🗺️','Semantic page structure',[\n['header','Introductory content for a page or section, often a heading and navigation.','\u003cheader>\u003ch2>Dragon Academy\u003c/h2>\u003cp>Learn to fly safely.\u003c/p>\u003c/header>',false],\n['nav','The main routes around your website. See the working navigation example above.','\u003cnav>\u003ca href=\"courses.html\">Courses\u003c/a>\u003c/nav>',false],\n['main','The document’s dominant content. Normally use one visible main element per page.','\u003cmain>\u003ch1>Training Courses\u003c/h1>\u003cp>Choose your adventure.\u003c/p>\u003c/main>',false],\n['section','Groups content by a shared theme, usually with a heading.','\u003csection>\u003ch2>Flying Courses\u003c/h2>\u003cp>Beginner and advanced lessons.\u003c/p>\u003c/section>',false],\n['article','A self-contained composition that could be distributed independently, such as a news story.','\u003carticle>\u003ch2>Baby Dragon Takes Flight!\u003c/h2>\u003cp>Only three roofs were damaged.\u003c/p>\u003c/article>',false],\n['footer','Closing information for a page or section, such as copyright or related links.','\u003cfooter>\u003csmall>© Dragon Academy\u003c/small>\u003c/footer>',false],\n['figure, figcaption, address','These also carry structural meaning: self-contained content, its caption, and relevant contact information.','\u003cfigure>🐉\u003cfigcaption>Our academy mascot.\u003c/figcaption>\u003c/figure>\\n\u003caddress>Contact: trainer@example.com\u003c/address>']\n]],\n['Sound and action 🎬','Multimedia',[\n['audio + source','audio embeds sound; controls shows playback controls. source provides a media file and format. Multiple sources offer alternatives. Add your own files to play.','\u003caudio controls>\\n  \u003csource src=\"roar.mp3\" type=\"audio/mpeg\">\\n  \u003csource src=\"roar.ogg\" type=\"audio/ogg\">\\n  Your browser does not support audio.\\n\u003c/audio>',false],\n['video + source','video embeds moving images. poster supplies a preview image. Use captions, commonly via track, when needed for accessible video.','\u003cvideo controls width=\"400\" poster=\"preview.jpg\">\\n  \u003csource src=\"flying.mp4\" type=\"video/mp4\">\\n  Your browser does not support video.\\n\u003c/video>',false],\n['iframe','Embeds another HTML document. Give it a descriptive title. Some external websites block embedding. srcdoc below supplies a small embedded page directly.','\u003ciframe title=\"Academy notice\" srcdoc=\"\u003ch2>Academy open!\u003c/h2>\u003cp>Flying lessons at 9 AM.\u003c/p>\">\u003c/iframe>']\n]],\n['Draw magic symbols ✨','SVG',[\n['svg, circle, rect, line, text','svg is the drawing area. circle uses cx/cy for center and r for radius. rect uses x/y/width/height. line joins x1/y1 to x2/y2. text places words at x/y. fill sets the interior color; stroke sets the outline. Coordinates increase rightward and downward.','\u003csvg width=\"300\" height=\"150\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Circle, rectangle, line and magic text\">\\n  \u003ccircle cx=\"45\" cy=\"45\" r=\"30\" fill=\"orange\" />\\n  \u003crect x=\"100\" y=\"15\" width=\"65\" height=\"60\" fill=\"purple\" />\\n  \u003cline x1=\"200\" y1=\"15\" x2=\"270\" y2=\"75\" stroke=\"green\" stroke-width=\"4\" />\\n  \u003ctext x=\"20\" y=\"120\" font-size=\"22\">Magic unlocked!\u003c/text>\\n\u003c/svg>']\n]],\n['Build the leaderboard 🏆','Tables',[\n['table, caption, thead, tbody, tfoot, tr, th, td','table contains the data. caption gives its title. thead, tbody and tfoot group header, body and summary rows. tr is a row; th is a header cell; td is a data cell. scope identifies row or column headers. Borders in these previews come from CSS.','\u003ctable>\\n  \u003ccaption>Dragon Leaderboard\u003c/caption>\\n  \u003cthead>\u003ctr>\u003cth scope=\"col\">Dragon\u003c/th>\u003cth scope=\"col\">Points\u003c/th>\u003c/tr>\u003c/thead>\\n  \u003ctbody>\\n    \u003ctr>\u003cth scope=\"row\">Chilli\u003c/th>\u003ctd>90\u003c/td>\u003c/tr>\\n    \u003ctr>\u003cth scope=\"row\">Frosty\u003c/th>\u003ctd>80\u003c/td>\u003c/tr>\\n  \u003c/tbody>\\n  \u003ctfoot>\u003ctr>\u003cth scope=\"row\">Total\u003c/th>\u003ctd>170\u003c/td>\u003c/tr>\u003c/tfoot>\\n\u003c/table>'],\n['colspan','Makes a cell span multiple columns. The spanning cell below covers both columns.','\u003ctable>\\n  \u003ctr>\u003cth colspan=\"2\">Dragon Statistics\u003c/th>\u003c/tr>\\n  \u003ctr>\u003cth>Speed\u003c/th>\u003cth>Power\u003c/th>\u003c/tr>\\n  \u003ctr>\u003ctd>80\u003c/td>\u003ctd>95\u003c/td>\u003c/tr>\\n\u003c/table>'],\n['rowspan','Makes a cell span multiple rows. Omit the covered cell in the following row.','\u003ctable>\\n  \u003ctr>\u003cth>Dragon\u003c/th>\u003cth>Skill\u003c/th>\u003c/tr>\\n  \u003ctr>\u003ctd rowspan=\"2\">Chilli\u003c/td>\u003ctd>Flying\u003c/td>\u003c/tr>\\n  \u003ctr>\u003ctd>Fire breathing\u003c/td>\u003c/tr>\\n\u003c/table>']\n]],\n['Recruit a trainer 📝','Forms',[\n['form','Collects controls for submission. action gives the destination; method sets the HTTP method. A server must process a real submission. This guide intercepts sample submissions locally.','\u003cform action=\"/apply\" method=\"post\">\\n  \u003clabel for=\"app-name\">Name\u003c/label>\\n  \u003cinput id=\"app-name\" name=\"trainer\" required>\\n  \u003cbutton type=\"submit\">Apply\u003c/button>\\n\u003c/form>'],\n['label + input','label gives a control its name. Its for must match the input’s id. input type chooses the control; name is its key in submitted data.','\u003clabel for=\"trainer-name\">Trainer name:\u003c/label>\\n\u003cinput type=\"text\" id=\"trainer-name\" name=\"trainer\" placeholder=\"Enter your name\">'],\n['textarea','A multiline field. Initial text goes between the tags.','\u003clabel for=\"reason\">Why join?\u003c/label>\\n\u003ctextarea id=\"reason\" name=\"reason\" rows=\"3\">I love dragons!\u003c/textarea>'],\n['select + option','select makes a selection control, usually a dropdown. option supplies each choice; value is the submitted value.','\u003clabel for=\"dragon-choice\">Dragon\u003c/label>\\n\u003cselect id=\"dragon-choice\" name=\"dragon\">\\n  \u003coption value=\"fire\">Fire Dragon\u003c/option>\\n  \u003coption value=\"ice\">Ice Dragon\u003c/option>\\n\u003c/select>'],\n['button','A button may submit, reset, or perform a scripted action. Specify type: inside a form, a button normally submits if type is omitted.','\u003cbutton type=\"button\" onclick=\"this.textContent=\\'ROAAAR! 🐉\\'\">Make the dragon roar\u003c/button>'],\n['fieldset + legend','fieldset groups related controls. legend supplies the group caption.','\u003cfieldset>\\n  \u003clegend>Trainer details\u003c/legend>\\n  \u003clabel for=\"nickname\">Nickname\u003c/label>\\n  \u003cinput id=\"nickname\" name=\"nickname\">\\n\u003c/fieldset>'],\n['progress','Shows task completion, not user input. value/max gives the completed fraction; omit value for indeterminate progress. Automatic updates require JavaScript.','\u003clabel for=\"training\">Training progress\u003c/label>\\n\u003cprogress id=\"training\" value=\"70\" max=\"100\">70%\u003c/progress>']\n]]\n];\nconst inputs=[\n['text','Single-line text. placeholder is a hint, not a replacement for a label.','placeholder=\"Trainer name\"'],\n['password','Masks characters visually; it does not encrypt data. minlength sets a length constraint.','minlength=\"8\"'],\n['email','Checks basic email formatting during normal form validation; it does not prove that an address exists.','placeholder=\"you@example.com\"'],\n['number','Numeric input. min and max set bounds; step sets the increment.','min=\"1\" max=\"5\" step=\"1\" value=\"1\"'],\n['date','A date picker. Display varies by browser and locale; the value uses YYYY-MM-DD.',''],\n['time','A time of day, without a date or time zone.',''],\n['file','Selects a file. accept guides selection, not secure validation. Real file-upload forms normally use method=\"post\" and enctype=\"multipart/form-data\".','accept=\"image/*\"'],\n['checkbox','An independent on/off choice. Multiple boxes can be selected. Unchecked boxes are normally omitted from submitted data.','value=\"flying\"'],\n['radio','One choice in a group. Radio buttons with the same name form the group.','value=\"fire\"'],\n['range','A numeric slider. Useful when an approximate value is enough; it does not automatically show its number as text.','min=\"0\" max=\"100\" value=\"50\"'],\n['submit','Submits a form, normally after browser validation.','value=\"Send application\"'],\n['reset','Restores initial form values, which are not necessarily empty.','value=\"Restore starting values\"'],\n['button','Has no default action. JavaScript supplies its behavior.','value=\"Roar!\" onclick=\"this.value=\\'ROAAAR!\\'\"']\n];\ngroups.push(['Meet the input squad 🎮','All input types',inputs.map(([type,desc,attrs],i)=>{\nlet code='\u003clabel for=\"input-'+type+'\">'+({checkbox:'Flying skill',radio:'Fire team',range:'Roar volume'}[type]||type+' example')+'\u003c/label>\\n\u003cinput type=\"'+type+'\" id=\"input-'+type+'\" name=\"'+type+'\" '+attrs+'>';\nif(type==='radio')code+='\\n\u003clabel>\u003cinput type=\"radio\" name=\"radio\" value=\"ice\"> Ice team\u003c/label>';\nif(type==='checkbox')code+='\\n\u003clabel>\u003cinput type=\"checkbox\" name=\"checkbox\" value=\"healing\"> Healing skill\u003c/label>';\nif(type==='submit'||type==='reset')code='\u003cform>\\n  \u003clabel>Trainer \u003cinput name=\"trainer\" value=\"Chilli\" required>\u003c/label>\\n  \u003cinput type=\"'+type+'\" '+attrs+'>\\n\u003c/form>';\nreturn ['input type=\"'+type+'\"',desc,code];\n})]);\nconst guide=document.getElementById('guide');document.body.id='top';\ngroups.forEach(([title,short,items],i)=>{\nconst section=document.createElement('section');section.id='topic-'+i;\nconst h=document.createElement('h2');h.textContent=(i+1)+'. '+title;section.append(h);\nitems.forEach(([tag,desc,code,live=true])=>{\nconst article=document.createElement('article');const heading=document.createElement('h3');heading.textContent=tag;const p=document.createElement('p');p.textContent=desc;article.append(heading,p);\nconst pair=document.createElement('div');pair.className=live?'pair':'';const left=document.createElement('div');const label=document.createElement('div');label.className='label';label.textContent='EXAMPLE CODE';const pre=document.createElement('pre');const c=document.createElement('code');c.textContent=code;pre.append(c);left.append(label,pre);pair.append(left);\nif(live){const right=document.createElement('div');const rl=document.createElement('div');rl.className='label';rl.textContent='BROWSER RESULT · TRY IT';const result=document.createElement('div');result.className='result';result.innerHTML=code;result.querySelectorAll('form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();let msg=result.querySelector('[role=\"status\"]');if(!msg){msg=document.createElement('p');msg.setAttribute('role','status');result.append(msg)}msg.textContent='✓ Demo submitted locally. No information was sent.'}));right.append(rl,result);pair.append(right)}article.append(pair);section.append(article);\n});guide.append(section);const a=document.createElement('a');a.href='#'+section.id;a.textContent=short;document.getElementById('contents').append(a);\n});\nconst ending=document.createElement('section');ending.innerHTML='\u003ch2>Final boss fight 🐲\u003c/h2>\u003cp>Which tags would you use for a main heading, an ordered list, deleted text, a hyperlink, and multiple selectable powers?\u003c/p>\u003cdetails>\u003csummary>Reveal answers\u003c/summary>\u003cp>\u003ccode>h1\u003c/code>, \u003ccode>ol\u003c/code> with \u003ccode>li\u003c/code>, \u003ccode>del\u003c/code>, \u003ccode>a href=\"…\"\u003c/code>, and \u003ccode>input type=\"checkbox\"\u003c/code>.\u003c/p>\u003c/details>\u003ch3>Quick reminders\u003c/h3>\u003cul>\u003cli>\u003ccode>&lt;!DOCTYPE html&gt;\u003c/code> is a declaration that selects standards mode, not an HTML tag.\u003c/li>\u003cli>To display HTML as text, write \u003ccode>&amp;lt;\u003c/code> for &lt; and \u003ccode>&amp;gt;\u003c/code> for &gt;.\u003c/li>\u003cli>Use CSS for purely visual formatting. Use semantic tags for meaning.\u003c/li>\u003cli>Examples with filenames such as dragon.jpg, academy.css, roar.mp3, and flying.mp4 require your own files; those resources are not included.\u003c/li>\u003cli>Examples share this guide’s typography and table styling, so their appearance may differ from an unstyled page.\u003c/li>\u003c/ul>';guide.append(ending);\n\u003c/script>\u003c/body>\u003c/html>\n","\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>CSS Quest — Dragon Academy Study Guide\u003c/title>\n\u003cstyle>\n:root{color-scheme:light;--ink:#202337;--accent:#6445c0}*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,sans-serif;color:var(--ink);background:#f5f4fa}header,main,footer{max-width:1100px;margin:auto;padding:28px}header{padding-top:48px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15}h2{margin-top:0}h3{margin-bottom:8px}a{color:var(--accent)}nav{display:flex;flex-wrap:wrap;gap:8px}nav a{padding:5px 12px;background:white;border-radius:20px;text-decoration:none}section{background:white;padding:26px;margin-bottom:24px;border-radius:16px}article{border-top:1px solid #e7e4ef;padding:20px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pair>div{min-width:0}pre{background:#202337;color:#f1eaff;padding:16px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px}code{font-family:Consolas,monospace}p code,li code{background:#f0edf8;padding:2px 5px;border-radius:4px}.label{font-size:.75rem;letter-spacing:.09em;font-weight:700;color:#756b89;margin:8px 0}.result{padding:18px;border:1px solid #e0dbea;border-radius:10px;min-height:100px}.tip{background:#f2eefa;padding:10px 15px;border-left:4px solid var(--accent)}summary{cursor:pointer;font-weight:600}button,input,select,textarea{font:inherit;max-width:100%}button{cursor:pointer}.sandbox{display:block}footer{color:#655d73}@media(max-width:680px){.pair{grid-template-columns:1fr}header,main,footer{padding:18px}section{padding:18px}}@media print{body{background:white}nav{display:none}section{break-inside:avoid}pre{background:#f3f3f3;color:black}}\n\u003c/style>\u003c/head>\u003cbody id=\"top\">\n\u003cheader>\u003cp>🐉 DRAGON ACADEMY · VOLUME TWO\u003c/p>\u003ch1>CSS Quest: give your academy some style\u003c/h1>\u003cp>HTML builds the rooms. CSS paints them, arranges the furniture, and adds a little magic. Learn the core CSS topics through explanations, example code, and live results — all in this one offline file.\u003c/p>\u003cp>Read a rule, look at its result, then try the mini challenges. Preview styles are isolated so each example keeps its own appearance.\u003c/p>\u003cnav id=\"contents\" aria-label=\"Study guide contents\">\u003c/nav>\u003c/header>\n\u003cmain id=\"guide\">\u003c/main>\u003cfooter>Save this file and open it in a modern browser. No libraries, images, fonts, or network connection required. This guide covers core CSS rather than every property in the language.\u003c/footer>\n\u003cscript>\nconst groups = [\n['Your first styling spell 🪄',[\n['CSS syntax','A selector chooses elements. Inside braces, each declaration pairs a property with a value. End declarations with semicolons. CSS comments use /* ... */.','\u003cp class=\"welcome\">Welcome, dragon trainer!\u003c/p>','.welcome {\\n  color: purple; /* text color */\\n  font-size: 24px;\\n}', 'Selector: .welcome · Property: color · Value: purple.'],\n['Inline, internal, and external CSS','Inline CSS goes in a style attribute. Internal CSS goes in a style element, normally in head. External CSS goes in a separate .css file linked from HTML. External stylesheets are convenient for shared site styling.','\u003cp style=\"color: purple;\">Inline magic\u003c/p>\\n\u003c!-- Internal, inside head: -->\\n\u003cstyle>p { color: purple; }\u003c/style>\\n\u003c!-- External, inside head: -->\\n\u003clink rel=\"stylesheet\" href=\"academy.css\">','/* academy.css */\\np { color: purple; }','The external-file example is illustrative; this guide itself is self-contained.',false]\n]],\n['Choose your targets 🎯',[\n['Element, class, ID, and universal selectors','p selects all paragraphs; .badge selects a class; #captain selects an ID. * selects all elements. Reuse classes; keep each ID unique in its document.','\u003cp>Regular trainer\u003c/p>\\n\u003cp class=\"badge\">Flying expert\u003c/p>\\n\u003cp id=\"captain\">Captain Chilli\u003c/p>','* { box-sizing: border-box; }\\np { color: #555; }\\n.badge { background: #fff0bd; padding: 8px; }\\n#captain { color: purple; font-weight: bold; }'],\n['Grouping and relationship selectors','A comma groups selectors. A space selects descendants; > selects direct children; + selects the next adjacent sibling; ~ selects later matching siblings with the same parent.','\u003cdiv class=\"team\">\\n  \u003cp>Direct child\u003c/p>\\n  \u003cdiv>\u003cp>Nested descendant\u003c/p>\u003c/div>\\n\u003c/div>\\n\u003ch4>Team news\u003c/h4>\\n\u003cp>First update\u003c/p>\\n\u003cp>Second update\u003c/p>','.team p { color: purple; }\\n.team > p { font-weight: bold; }\\nh4 + p { background: #fff0bd; }\\nh4 ~ p { border-left: 3px solid orange; }\\nh4, .team { margin-bottom: 12px; }'],\n['Attribute selectors','Select elements by their attributes. [type=\"email\"] matches one exact value; [href^=\"#\"] matches values starting with #.','\u003clabel>Email \u003cinput type=\"email\" placeholder=\"trainer@example.com\">\u003c/label>\\n\u003ca href=\"#camp\">Camp link\u003c/a>','input[type=\"email\"] { border: 2px solid purple; }\\na[href^=\"#\"] { color: #9b4200; }'],\n['Pseudo-classes: state and position','A pseudo-class selects a state or structural position. Hover the button, focus it with Tab, and inspect the alternating list rows.','\u003cbutton>Train dragon\u003c/button>\\n\u003cul>\u003cli>Fire\u003c/li>\u003cli>Ice\u003c/li>\u003cli>Storm\u003c/li>\u003c/ul>','button:hover { background: purple; color: white; }\\nbutton:focus-visible { outline: 3px solid orange; outline-offset: 3px; }\\nli:first-child { font-weight: bold; }\\nli:nth-child(even) { background: #eee8fa; }','Other useful states include :checked, :disabled, :required, and :invalid. Never make essential information hover-only.'],\n['Pseudo-elements: part of an element','::before and ::after insert generated content; ::first-letter styles the first letter. Generated decoration should not be the only way important information is conveyed.','\u003cp class=\"news\">Dragons spotted near the academy.\u003c/p>','.news::before { content: \"🐉 \"; }\\n.news::after { content: \" ✨\"; }\\n.news::first-letter { font-size: 28px; }']\n]],\n['Which spell wins? ⚖️',[\n['Cascade, specificity, and source order','For competing normal author rules in the same layer, IDs outrank classes/attributes/pseudo-classes, which outrank element selectors. Equal specificity is resolved by later source order. The broader cascade also considers origin, importance, layers, and other factors.','\u003cp id=\"leader\" class=\"trainer\">What color am I?\u003c/p>','p { color: green; }\\n.trainer { color: blue; }\\n#leader { color: purple; }\\np { color: orange; }','Purple wins: the ID selector is more specific. Later does not automatically mean stronger.'],\n['Inheritance and explicit reset values','Properties such as color and font-family normally inherit. Margin, padding, and borders normally do not. inherit copies the parent; initial uses the property’s initial value; unset inherits inheritable properties and otherwise uses initial.','\u003cdiv class=\"parent\">Parent text\\n  \u003cp>Child inherits purple.\u003c/p>\\n  \u003cp class=\"reset\">Child uses initial text color.\u003c/p>\\n\u003c/div>','.parent { color: purple; border: 2px solid purple; padding: 12px; }\\n.reset { color: initial; }'],\n['Use !important sparingly','!important changes a declaration’s cascade priority. It is not simply a bigger specificity score. It can be useful for intentional overrides, but frequent use makes styling harder to manage.','\u003cp id=\"captain\">Important override\u003c/p>','p { color: #9b4200 !important; }\\n#captain { color: purple; }','Prefer clear selectors and organized styles over a battle of important declarations.']\n]],\n['Colors, backgrounds, and units 🎨',[\n['Colors and gradients','Colors can use names, hex, rgb(), or hsl(). Alpha controls transparency. A background can combine colors, gradients, and images.','\u003cdiv class=\"banner\">Welcome to Dragon Academy\u003c/div>','.banner {\\n  color: white;\\n  background: linear-gradient(120deg, #56349a, #9c3670);\\n  padding: 24px;\\n  border: 4px solid rgb(100 60 160 / 25%);\\n}','For images: background-image: url(\"sky.jpg\"); background-size: cover; background-position: center. cover may crop the image.'],\n['px, %, em, rem, vw, and vh','px is a CSS pixel. % depends on the property and its containing context. rem uses the root font size; em often uses the element’s font size (font-size itself uses the parent). vw/vh use viewport dimensions.','\u003cdiv class=\"track\">\u003cdiv class=\"bar\">70%\u003c/div>\u003c/div>\\n\u003cp class=\"spell\">Flexible text\u003c/p>','.track { width: 100%; background: #eee; }\\n.bar { width: 70%; padding: 0.5em; background: #ddd0f4; }\\n.spell { font-size: 1.25rem; margin-top: 16px; }','100vw is the viewport width, not necessarily the available parent width. Avoid using it indiscriminately inside containers.'],\n['min(), max(), clamp(), and calc()','Math functions combine sizing rules. clamp(min, preferred, max) keeps a flexible value within bounds. calc() performs arithmetic; min() picks the smaller result and max() the larger.','\u003cdiv class=\"sized\">A responsive spell card\u003c/div>','.sized {\\n  width: min(100%, 320px);\\n  padding: clamp(12px, 2vw, 24px);\\n  font-size: clamp(16px, 2vw, 24px);\\n  border: 2px solid purple;\\n  margin-bottom: calc(8px + 1rem);\\n}']\n]],\n['Dress up the words ✍️',[\n['Fonts, size, weight, and line height','font-family supplies a fallback list. font-size sets size; font-weight sets thickness; font-style sets italic text; line-height controls line spacing. A unitless line-height adapts well to inherited font sizes.','\u003cp class=\"intro\">Your dragon is ready for its first flying lesson.\u003c/p>','.intro {\\n  font-family: Georgia, serif;\\n  font-size: 22px;\\n  font-weight: 700;\\n  font-style: italic;\\n  line-height: 1.6;\\n}'],\n['Alignment, decoration, spacing, and wrapping','text-align aligns inline content. text-decoration adds lines; text-transform changes presentation of case. letter-spacing adjusts characters. overflow-wrap helps long strings fit.','\u003cp class=\"title\">dragon academy\u003c/p>\\n\u003cp class=\"long\">SuperExtraLongDragonTrainerIdentificationNumber123456789\u003c/p>','.title { text-align: center; text-transform: uppercase; letter-spacing: 2px; text-decoration: underline; }\\n.long { overflow-wrap: anywhere; }','text-align: center centers text, not the block itself. white-space: pre-wrap preserves spaces while allowing wrapping.']\n]],\n['Build a comfortable box 📦',[\n['The box model','From inside out: content → padding → border → margin. Padding creates inside space; margin creates outside space. The preview’s tinted outer container makes the spacing visible.','\u003cdiv class=\"space\">\u003cdiv class=\"box\">Dragon nest\u003c/div>\u003c/div>','.space { background: #fff0bd; display: flow-root; }\\n.box {\\n  margin: 20px;\\n  border: 4px solid purple;\\n  padding: 20px;\\n  background: #eee6fa;\\n}','Shorthand with four values follows top, right, bottom, left. Two values mean vertical, horizontal.'],\n['box-sizing and dimensions','With content-box, width covers content only; padding and border increase the rendered width. With border-box, width includes padding and border. Margins remain outside both.','\u003cdiv class=\"a\">content-box\u003c/div>\\n\u003cdiv class=\"b\">border-box\u003c/div>','.a, .b { width: 180px; padding: 15px; border: 5px solid purple; margin-bottom: 10px; }\\n.a { box-sizing: content-box; }\\n.b { box-sizing: border-box; }','First box: 180 + 30 + 10 = 220px. Second box: 180px overall. min-width, max-width, min-height, and max-height constrain dimensions.'],\n['Borders, rounded corners, shadows, and outlines','border participates in the box model. border-radius rounds corners. box-shadow paints a shadow without changing layout. outline is drawn outside the border and is useful for focus.','\u003cdiv class=\"card\">Premium dragon nest\u003c/div>','.card {\\n  padding: 20px;\\n  border: 2px solid #6445c0;\\n  border-radius: 18px;\\n  box-shadow: 4px 6px 12px rgb(50 20 90 / 20%);\\n}','box-shadow values here mean horizontal offset, vertical offset, blur, color. Do not remove keyboard focus outlines without a visible replacement.'],\n['Overflow','overflow controls content that exceeds the box: visible, hidden, auto, or scroll. auto adds scrolling when needed; hidden clips content.','\u003cdiv class=\"scroll\">Flying lesson one: keep your wings open. Flying lesson two: avoid the tower. Flying lesson three: land gently. Repeat these lessons until your dragon is confident.\u003c/div>','.scroll { max-height: 90px; overflow: auto; padding: 12px; border: 2px solid purple; }']\n]],\n['Arrange the academy 🏗️',[\n['display: block, inline, inline-block, none','Block boxes normally start a new line. Inline boxes flow with text and do not obey width/height like blocks. Inline-block flows inline while accepting dimensions. display:none removes the element from layout.','\u003cspan class=\"block\">Block badge\u003c/span>\\n\u003cspan class=\"inline\">Inline\u003c/span>\\n\u003cspan class=\"ib\">Inline-block\u003c/span>\\n\u003cspan class=\"gone\">Hidden dragon\u003c/span>','.block { display: block; background: #eee6fa; }\\n.inline { display: inline; background: #fff0bd; }\\n.ib { display: inline-block; padding: 10px; width: 130px; background: #ddd0f4; }\\n.gone { display: none; }','visibility:hidden keeps layout space while hiding the element. opacity:0 makes it transparent but can leave it interactive and focusable.'],\n['Flexbox: arrange in one main direction','display:flex arranges direct children. gap spaces them. justify-content aligns on the main axis; align-items aligns on the cross axis. flex-wrap allows additional lines.','\u003cdiv class=\"team\">\u003cdiv>🔥 Fire\u003c/div>\u003cdiv>❄️ Ice\u003c/div>\u003cdiv>⚡ Storm\u003c/div>\u003c/div>','.team { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }\\n.team > div { padding: 14px; background: #eee6fa; }','flex-direction:column changes the main axis to vertical; justify-content and align-items follow the axes.'],\n['Flex sizing','flex:1 1 120px means grow factor 1, shrink factor 1, and a 120px basis. min-width:0 lets items shrink below their content’s automatic minimum when appropriate.','\u003cdiv class=\"row\">\u003cdiv>Trainer\u003c/div>\u003cdiv>Dragon\u003c/div>\u003cdiv>Equipment\u003c/div>\u003c/div>','.row { display: flex; flex-wrap: wrap; gap: 10px; }\\n.row > div { flex: 1 1 120px; min-width: 0; padding: 12px; background: #ddd0f4; }'],\n['Grid: rows and columns','display:grid creates a two-dimensional layout. grid-template-columns defines tracks; fr shares available space. gap separates cells.','\u003cdiv class=\"grid\">\u003cdiv>Fire\u003c/div>\u003cdiv>Ice\u003c/div>\u003cdiv>Storm\u003c/div>\u003cdiv>Earth\u003c/div>\u003c/div>','.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }\\n.grid > div { background: #eee6fa; padding: 14px; }'],\n['Grid placement and spanning','A grid item can span multiple tracks. grid-column:1 / -1 spans from the first grid line to the last explicit column line.','\u003cdiv class=\"layout\">\u003cdiv class=\"banner\">Academy notice\u003c/div>\u003cdiv>Courses\u003c/div>\u003cdiv>Dragons\u003c/div>\u003c/div>','.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\\n.layout > div { padding: 12px; background: #eee6fa; }\\n.banner { grid-column: 1 / -1; }'],\n['Position: static, relative, absolute','static follows normal flow. relative stays in flow but may shift visually. absolute leaves normal flow and is positioned against its containing block, often the nearest positioned ancestor.','\u003cdiv class=\"nest\">Dragon nest\u003cspan class=\"badge\">NEW\u003c/span>\u003c/div>','.nest { position: relative; padding: 35px 18px; background: #eee6fa; }\\n.badge { position: absolute; top: 8px; right: 8px; background: purple; color: white; padding: 2px 8px; }'],\n['Fixed, sticky, and z-index','fixed is normally positioned relative to the viewport; some ancestors can change its containing block. sticky behaves in flow until it reaches an inset threshold inside its scrolling context. z-index controls layering within stacking contexts.','\u003cdiv class=\"scroll\">\u003cdiv class=\"sticky\">Sticky training notice\u003c/div>\u003cp>Lesson 1\u003c/p>\u003cp>Lesson 2\u003c/p>\u003cp>Lesson 3\u003c/p>\u003cp>Lesson 4\u003c/p>\u003c/div>','.scroll { height: 160px; overflow: auto; }\\n.sticky { position: sticky; top: 0; z-index: 1; background: #ddd0f4; padding: 8px; }','A large z-index cannot escape an ancestor’s stacking context. For a fixed button: position:fixed; bottom:16px; right:16px.'],\n['Float and clear','float lets text wrap around an element. It is useful for editorial wrapping; use Flexbox or Grid for general page layout. clear prevents an element from sitting beside floats on specified sides.','\u003cdiv class=\"story\">\u003cspan class=\"dragon\">🐉\u003c/span>\u003cp>Chilli is the academy mascot. This text flows alongside the dragon before continuing below it.\u003c/p>\u003cp class=\"after\">New paragraph below the float.\u003c/p>\u003c/div>','.story { display: flow-root; }\\n.dragon { float: left; font-size: 48px; margin-right: 14px; }\\n.after { clear: both; }']\n]],\n['Make it work on phones 📱',[\n['Responsive layouts and media queries','Start with a small-screen layout and add rules for wider viewports. Media queries test conditions such as viewport width. Resize the browser to see this sample change.','\u003cdiv class=\"responsive\">\u003cdiv>Fire course\u003c/div>\u003cdiv>Ice course\u003c/div>\u003c/div>','.responsive { display: grid; grid-template-columns: 1fr; gap: 10px; }\\n.responsive > div { padding: 12px; background: #eee6fa; }\\n@media (min-width: 800px) {\\n  .responsive { grid-template-columns: 1fr 1fr; }\\n}','The media query checks the full browser viewport, not just this preview. Include the viewport meta tag in your HTML.'],\n['Auto-fitting grids','repeat(auto-fit, minmax(...)) fits as many columns as the available width permits. This is useful for cards without many breakpoints.','\u003cdiv class=\"auto\">\u003cdiv>Fire\u003c/div>\u003cdiv>Ice\u003c/div>\u003cdiv>Storm\u003c/div>\u003c/div>','.auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 10px; }\\n.auto > div { background: #ddd0f4; padding: 12px; }'],\n['Responsive images and object-fit','max-width:100% prevents an image from exceeding its container; height:auto preserves its ratio. For a fixed thumbnail box, object-fit:cover fills it with possible cropping; contain preserves the whole image with possible empty space.','\u003cimg class=\"dragon-photo\" src=\"dragon.jpg\" alt=\"Chilli beside the academy\">','.dragon-photo { max-width: 100%; height: auto; }\\n/* Fixed thumbnail alternative: */\\n/* .dragon-photo { width: 240px; height: 160px; object-fit: cover; } */','This code needs your own dragon.jpg; no external image is included.',false]\n]],\n['Add a little motion ✨',[\n['Transforms and transitions','transform changes visual position, rotation, or scale without reflowing surrounding content. transition smoothly interpolates a property when its value changes. Hover or keyboard-focus the button.','\u003cbutton class=\"launch\">Launch dragon 🚀\u003c/button>','.launch { padding: 12px; transition: transform 200ms ease, background-color 200ms ease; }\\n.launch:hover, .launch:focus-visible { transform: translateY(-4px) rotate(-2deg); background-color: #ddd0f4; }\\n@media (prefers-reduced-motion: reduce) { .launch { transition: none; } }'],\n['Keyframe animations','@keyframes defines stages. animation sets the name, duration, timing, and other options. This flight runs once when you hover or keyboard-focus the training area.','\u003cbutton class=\"flight\">🐉 Practice flight\u003c/button>','@keyframes lift {\\n  0%, 100% { transform: translateY(0); }\\n  50% { transform: translateY(-10px); }\\n}\\n.flight:hover, .flight:focus-visible { animation: lift 700ms ease-in-out; }\\n@media (prefers-reduced-motion: reduce) { .flight { animation: none; } }','Other animation controls include animation-delay, animation-iteration-count, animation-direction, and animation-fill-mode.']\n]],\n['Reusable magic and form styling 🧰',[\n['Custom properties (CSS variables)','Custom properties start with -- and are read using var(). They participate in the cascade and normally inherit. A fallback can be supplied as the second argument to var().','\u003cdiv class=\"theme\">\u003cbutton>Join academy\u003c/button>\u003cp>One theme, shared colors.\u003c/p>\u003c/div>','.theme { --brand: #6445c0; }\\n.theme button { background: var(--brand, purple); color: white; padding: 10px; border: 0; }\\n.theme p { color: var(--brand); }','Use :root for document-wide defaults; a class can override variables for one region.'],\n['Form controls and validation states','Use font:inherit to match surrounding text. Give controls visible labels, padding, and focus feedback. :checked and :disabled style control states; browser validation supplies :valid and :invalid.','\u003clabel>Email \u003cinput type=\"email\" placeholder=\"Try an invalid email\">\u003c/label>\\n\u003clabel>\u003cinput type=\"checkbox\"> Flying certified\u003c/label>\\n\u003cbutton disabled>Locked course\u003c/button>','input { font: inherit; padding: 8px; max-width: 100%; }\\ninput:focus-visible { outline: 3px solid #b890ee; outline-offset: 2px; }\\ninput[type=\"email\"]:invalid { border: 2px solid #b02020; }\\ninput[type=\"checkbox\"] { accent-color: purple; }\\nbutton:disabled { opacity: 0.55; cursor: not-allowed; }','An empty optional email field is valid. Do not communicate errors through color alone in a real form.'],\n['Styling lists and tables','list-style controls list markers. border-collapse merges table borders. Use CSS borders and spacing instead of old presentational HTML attributes.','\u003cul>\u003cli>Helmet\u003c/li>\u003cli>Shield\u003c/li>\u003c/ul>\\n\u003ctable>\u003ccaption>Scores\u003c/caption>\u003ctr>\u003cth scope=\"col\">Dragon\u003c/th>\u003cth scope=\"col\">Points\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Chilli\u003c/td>\u003ctd>90\u003c/td>\u003c/tr>\u003c/table>','ul { list-style-type: square; padding-left: 24px; }\\ntable { border-collapse: collapse; width: 100%; }\\nth, td { padding: 8px; border-bottom: 1px solid #cfc3e4; text-align: left; }\\nth { background: #eee6fa; }']\n]]\n];\nconst guide=document.getElementById('guide');\ngroups.forEach(([title,items],i)=>{\n const section=document.createElement('section');section.id='topic-'+i;\n const heading=document.createElement('h2');heading.textContent=(i+1)+'. '+title;section.append(heading);\n const link=document.createElement('a');link.href='#'+section.id;link.textContent=title;document.getElementById('contents').append(link);\n items.forEach(([name,explanation,html,css,tip,live=true])=>{\n  const article=document.createElement('article');const h=document.createElement('h3');h.textContent=name;const p=document.createElement('p');p.textContent=explanation;article.append(h,p);\n  const pair=document.createElement('div');pair.className=live?'pair':'';const source=document.createElement('div');\n  [['HTML',html],['CSS',css]].forEach(([label,value])=>{const l=document.createElement('div');l.className='label';l.textContent=label;const pre=document.createElement('pre');const code=document.createElement('code');code.textContent=value;pre.append(code);source.append(l,pre)});pair.append(source);\n  if(live){const column=document.createElement('div');const label=document.createElement('div');label.className='label';label.textContent='LIVE RESULT';const box=document.createElement('div');box.className='result';const host=document.createElement('div');host.className='sandbox';const shadow=host.attachShadow({mode:'open'});const style=document.createElement('style');style.textContent=':host{display:block;font:16px/1.6 system-ui,sans-serif;color:#202337}button,input,select,textarea{font:inherit;max-width:100%}button{cursor:pointer}p{overflow-wrap:anywhere}'+css;const content=document.createElement('div');content.innerHTML=html;shadow.append(style,content);box.append(host);column.append(label,box);pair.append(column)}\n  article.append(pair);if(tip){const note=document.createElement('p');note.className='tip';note.textContent=tip;article.append(note)}section.append(article);\n });guide.append(section);\n});\nconst end=document.createElement('section');end.innerHTML='\u003ch2>Boss fight: style a dragon card 🐲\u003c/h2>\u003cp>Create a card with purple text, 20px inside spacing, rounded corners, and two side-by-side skill badges that wrap when space runs out.\u003c/p>\u003cdetails>\u003csummary>Reveal one solution\u003c/summary>\u003cpre>\u003ccode>\u003c/code>\u003c/pre>\u003c/details>\u003ch3>Your debugging spellbook\u003c/h3>\u003col>\u003cli>Check that the stylesheet loaded and the selector matches the element.\u003c/li>\u003cli>Check spelling, braces, units, and semicolons.\u003c/li>\u003cli>Inspect the element in browser developer tools: crossed-out declarations lost the cascade.\u003c/li>\u003cli>Check the computed style and box model to see what actually applies.\u003c/li>\u003cli>Check the parent layout, available space, and media-query conditions.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Memory shortcut:\u003c/strong> selector = who, property = what, value = how.\u003c/p>';\nend.querySelector('code').textContent='.dragon-card {\\n  color: purple;\\n  padding: 20px;\\n  border: 2px solid purple;\\n  border-radius: 16px;\\n}\\n.skills {\\n  display: flex;\\n  flex-wrap: wrap;\\n  gap: 12px;\\n}';guide.append(end);\n\u003c/script>\u003c/body>\u003c/html>\n","\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>JavaScript Quest — Dragon Academy\u003c/title>\u003cstyle>\n:root{color-scheme:light;--ink:#202337;--accent:#6445c0}*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,sans-serif;color:var(--ink);background:#f5f4fa}header,main,footer{max-width:1100px;margin:auto;padding:28px}header{padding-top:48px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15}h2{margin-top:0}h3{margin-bottom:8px}a{color:var(--accent)}nav{display:flex;flex-wrap:wrap;gap:8px}nav a{padding:5px 12px;background:white;border-radius:20px;text-decoration:none}section{background:white;padding:26px;margin-bottom:24px;border-radius:16px}article{border-top:1px solid #e7e4ef;padding:20px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pair>div{min-width:0}pre{background:#202337;color:#f1eaff;padding:16px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px}code{font-family:Consolas,monospace}p code,li code{background:#f0edf8;padding:2px 5px;border-radius:4px}.label{font-size:.75rem;letter-spacing:.09em;font-weight:700;color:#756b89;margin:8px 0}.result{padding:18px;border:1px solid #e0dbea;border-radius:10px;min-height:100px}.tip{background:#f2eefa;padding:10px 15px;border-left:4px solid var(--accent)}summary{cursor:pointer;font-weight:600}button,input,select,textarea{font:inherit;max-width:100%}button{cursor:pointer}.sandbox{display:block}footer{color:#655d73}@media(max-width:680px){.pair{grid-template-columns:1fr}header,main,footer{padding:18px}section{padding:18px}}@media print{body{background:white}nav{display:none}section{break-inside:avoid}pre{background:#f3f3f3;color:black}}\n\n.run{padding:8px 16px;border:0;border-radius:8px;background:#6445c0;color:white;margin:8px 0}iframe{width:100%;height:220px;border:1px solid #e0dbea;border-radius:10px;background:white}.pair{align-items:start}\u003c/style>\u003c/head>\u003cbody id=\"top\">\u003cheader>\u003cp>🐉 DRAGON ACADEMY · VOLUME THREE\u003c/p>\u003ch1>JavaScript Quest: make the magic happen\u003c/h1>\u003cp>Explanations, code, and runnable examples covering core JavaScript and browser programming. Click Run example, then interact with any controls that appear. Run again to start fresh.\u003c/p>\u003cp>Each runnable example has its own isolated preview. Network, storage, module, and setup examples are marked reference-only. This is a guide to core topics, not every JavaScript API.\u003c/p>\u003cnav aria-label=\"Contents\">\u003ca href=\"#topic-0\">First spells 🪄\u003c/a>\u003ca href=\"#topic-1\">Values and calculations 🧮\u003c/a>\u003ca href=\"#topic-2\">Make decisions and repeat 🔁\u003c/a>\u003ca href=\"#topic-3\">Reusable spells: functions 🧙\u003c/a>\u003ca href=\"#topic-4\">Inventory and dragon profiles 🎒\u003c/a>\u003ca href=\"#topic-5\">Bring the page to life ⚡\u003c/a>\u003ca href=\"#topic-6\">Wait without freezing the academy ⏳\u003c/a>\u003ca href=\"#topic-7\">Save, organize, and debug 🧰\u003c/a>\u003c/nav>\u003c/header>\u003cmain>\u003csection id=\"topic-0\">\u003ch2>1. First spells 🪄\u003c/h2>\u003carticle>\u003ch3>What JavaScript does\u003c/h3>\u003cp>HTML supplies structure, CSS supplies appearance, and JavaScript adds behavior. JavaScript can react to events, change the page, calculate values, and communicate with services. In these examples, print() is a helper supplied by this guide; console.log() is the usual way to log to browser developer tools.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>print('Welcome to Dragon Academy!');\nconsole.log('Also visible in developer tools.');\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"0\">Run example ▶\u003c/button>\u003ciframe title=\"What JavaScript does result\" id=\"demo-0\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Where to write JavaScript\u003c/h3>\u003cp>Place JavaScript inside a script element or load a separate .js file. defer on an external classic script lets HTML parsing finish before execution. This code is an HTML setup example; it is not run here.\u003c/p>\u003cdiv class=\"\">\u003cdiv>\u003cdiv class=\"label\">REFERENCE CODE\u003c/div>\u003cpre>\u003ccode>&lt;!-- In your HTML: --&gt;\n&lt;script src=&quot;academy.js&quot; defer&gt;&lt;/script&gt;\n&lt;!-- Or: --&gt;\n&lt;script&gt;console.log('Academy open!');&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Statements and comments\u003c/h3>\u003cp>Statements tell the program what to do. // starts a single-line comment; /* ... */ encloses a block comment. Strings need quotes; JavaScript is case-sensitive.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>// Announce the lesson.\nprint('Flying starts at 9 AM.');\n/* Comments are ignored by the program. */\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"2\">Run example ▶\u003c/button>\u003ciframe title=\"Statements and comments result\" id=\"demo-2\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>let, const, and var\u003c/h3>\u003cp>let declares a variable you may reassign. const requires an initial value and prevents reassignment of that binding. Both are block-scoped. Older var is function-scoped and behaves differently; prefer const by default and let when reassignment is needed.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const dragon = 'Chilli';\nlet points = 10;\npoints += 5;\nprint(dragon + ': ' + points + ' points');\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"3\">Run example ▶\u003c/button>\u003ciframe title=\"let, const, and var result\" id=\"demo-3\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003cp class=\"tip\">const does not freeze an object or array: their contents can still change.\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"topic-1\">\u003ch2>2. Values and calculations 🧮\u003c/h2>\u003carticle>\u003ch3>Data types\u003c/h3>\u003cp>Common primitives are string, number, boolean, undefined, null, bigint, and symbol. Objects include arrays and functions. typeof helps inspect types, but typeof null is the historical exception &quot;object&quot;.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>print(typeof 'Chilli');\nprint(typeof 42);\nprint(typeof true);\nlet unknown;\nprint(typeof unknown);\nprint(typeof null);\nprint(typeof 10n);\nprint(typeof Symbol('id'));\nprint(Array.isArray(['Fire', 'Ice']));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"4\">Run example ▶\u003c/button>\u003ciframe title=\"Data types result\" id=\"demo-4\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Arithmetic and assignment\u003c/h3>\u003cp>+ adds numbers (or concatenates strings), - subtracts, * multiplies, / divides, % gives the remainder, and ** raises a power. += updates a value. Parentheses control grouping.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>let coins = 20;\ncoins += 5;\nprint(coins);\nprint(10 % 3);\nprint(2 ** 3);\nprint((4 + 2) * 3);\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"5\">Run example ▶\u003c/button>\u003ciframe title=\"Arithmetic and assignment result\" id=\"demo-5\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Comparisons and logical operators\u003c/h3>\u003cp>=== compares without type coercion; !== checks strict inequality. &gt;, &lt;, &gt;=, and &lt;= compare values. &amp;&amp; and || short-circuit and return operand values, not always booleans. ! negates truthiness.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>print(5 === '5');\nprint(5 == '5'); // Coercion: true\nconst age = 18;\nconst hasHelmet = true;\nprint(age &gt;= 16 &amp;&amp; hasHelmet);\nprint(!hasHelmet);\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"6\">Run example ▶\u003c/button>\u003ciframe title=\"Comparisons and logical operators result\" id=\"demo-6\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003cp class=\"tip\">Prefer strict equality unless you deliberately want coercion.\u003c/p>\u003c/article>\u003carticle>\u003ch3>Conversion, truthiness, and nullish defaults\u003c/h3>\u003cp>Number(), String(), and Boolean() convert values. Falsy values include false, 0, empty string, null, undefined, and NaN. Empty arrays and objects are truthy. ?? supplies a default only for null or undefined; || also replaces other falsy values.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>print(Number('25') + 5);\nprint(Boolean('false')); // Nonempty string: true\nprint(Boolean([]));\nprint(0 || 10);\nprint(0 ?? 10);\nprint(Number.isNaN(Number('dragon')));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"7\">Run example ▶\u003c/button>\u003ciframe title=\"Conversion, truthiness, and nullish defaults result\" id=\"demo-7\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Strings and template literals\u003c/h3>\u003cp>Strings store text. Template literals use backticks and ${...} to insert expressions. String methods return new strings; strings are immutable.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const name = 'Chilli';\nprint(`Hello, ${name}!`);\nprint(name.toUpperCase());\nprint('  Fire  '.trim());\nprint('Dragon Academy'.includes('Academy'));\nprint(name.slice(0, 3));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"8\">Run example ▶\u003c/button>\u003ciframe title=\"Strings and template literals result\" id=\"demo-8\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Numbers, Math, and Date\u003c/h3>\u003cp>Math provides numeric helpers; Date represents a date-time. Math.random() is useful for casual game examples, not security tokens. Date month indexes in the numeric constructor start at zero.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>print(Math.round(4.7));\nprint(Math.max(10, 25, 8));\nprint(Math.floor(Math.random() * 6) + 1);\nconst lesson = new Date(2026, 8, 13);\nprint(lesson.toLocaleDateString());\nprint((0.1 + 0.2).toFixed(2));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"9\">Run example ▶\u003c/button>\u003ciframe title=\"Numbers, Math, and Date result\" id=\"demo-9\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003cp class=\"tip\">Floating-point arithmetic can have tiny rounding differences. toFixed() returns a string.\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"topic-2\">\u003ch2>3. Make decisions and repeat 🔁\u003c/h2>\u003carticle>\u003ch3>if, else if, and else\u003c/h3>\u003cp>Run a branch only when its condition is truthy. The first matching branch wins.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const score = 75;\nif (score &gt;= 90) {\n  print('Master trainer');\n} else if (score &gt;= 60) {\n  print('Ready to fly');\n} else {\n  print('More practice needed');\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"10\">Run example ▶\u003c/button>\u003ciframe title=\"if, else if, and else result\" id=\"demo-10\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Ternary and switch\u003c/h3>\u003cp>The ternary operator condition ? a : b chooses one expression. switch compares cases using strict equality. break exits a case; without it, execution can fall through.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const hasHelmet = true;\nprint(hasHelmet ? 'Board the dragon' : 'Get a helmet');\nconst element = 'ice';\nswitch (element) {\n  case 'fire': print('Bring water'); break;\n  case 'ice': print('Bring a coat'); break;\n  default: print('Bring a shield');\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"11\">Run example ▶\u003c/button>\u003ciframe title=\"Ternary and switch result\" id=\"demo-11\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>for, while, and do...while\u003c/h3>\u003cp>for combines initialization, condition, and update. while checks before every iteration. do...while runs the body at least once. Always ensure loops can end.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>for (let lap = 1; lap &lt;= 3; lap++) {\n  print('Flying lap ' + lap);\n}\nlet energy = 2;\nwhile (energy &gt; 0) {\n  print('Energy: ' + energy);\n  energy--;\n}\ndo { print('At least one greeting!'); } while (false);\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"12\">Run example ▶\u003c/button>\u003ciframe title=\"for, while, and do...while result\" id=\"demo-12\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>for...of, for...in, break, and continue\u003c/h3>\u003cp>for...of iterates values in an iterable such as an array. for...in iterates enumerable string keys, including inherited ones; Object.keys() is often clearer for an object’s own keys. continue skips an iteration; break ends the loop.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>for (const skill of ['Flying', 'Sleeping', 'Healing']) {\n  if (skill === 'Sleeping') continue;\n  print(skill);\n}\nconst stats = { speed: 80, power: 90 };\nfor (const key of Object.keys(stats)) {\n  print(key + ': ' + stats[key]);\n}\nfor (let n = 1; n &lt;= 5; n++) {\n  if (n === 3) break;\n  print(n);\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"13\">Run example ▶\u003c/button>\u003ciframe title=\"for...of, for...in, break, and continue result\" id=\"demo-13\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003c/section>\u003csection id=\"topic-3\">\u003ch2>4. Reusable spells: functions 🧙\u003c/h2>\u003carticle>\u003ch3>Functions, parameters, and return\u003c/h3>\u003cp>A function packages reusable behavior. Parameters receive arguments. return sends a value back and ends that call. Without an explicit returned value, the result is undefined.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>function feedDragon(name, portions = 1) {\n  return name + ' ate ' + portions + ' portions.';\n}\nprint(feedDragon('Chilli', 3));\nprint(feedDragon('Frosty'));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"14\">Run example ▶\u003c/button>\u003ciframe title=\"Functions, parameters, and return result\" id=\"demo-14\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Arrow functions and callbacks\u003c/h3>\u003cp>Arrow functions offer compact syntax. A callback is a function passed to another function. Arrows capture the surrounding this; they do not create their own this binding.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const double = number =&gt; number * 2;\nfunction reward(points, transform) {\n  return transform(points);\n}\nprint(reward(10, double));\nprint([1, 2, 3].map(n =&gt; n * 3));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"15\">Run example ▶\u003c/button>\u003ciframe title=\"Arrow functions and callbacks result\" id=\"demo-15\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Scope, hoisting, and closures\u003c/h3>\u003cp>Scope controls where a name is accessible. A closure lets a function retain access to its surrounding lexical variables. Function declarations can generally be called earlier in their scope; accessing let or const before initialization throws an error.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>function createCounter() {\n  let count = 0;\n  return function () {\n    count++;\n    return count;\n  };\n}\nconst countFlights = createCounter();\nprint(countFlights());\nprint(countFlights());\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"16\">Run example ▶\u003c/button>\u003ciframe title=\"Scope, hoisting, and closures result\" id=\"demo-16\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003cp class=\"tip\">Each call to createCounter() creates independent counter state.\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"topic-4\">\u003ch2>5. Inventory and dragon profiles 🎒\u003c/h2>\u003carticle>\u003ch3>Arrays and basic methods\u003c/h3>\u003cp>Arrays store ordered values with zero-based indexes. push/pop add/remove at the end; unshift/shift work at the start. includes checks membership; slice copies a portion; splice changes the array.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const bag = ['Helmet', 'Shield'];\nbag.push('Snacks');\nprint(bag[0]);\nprint(bag.length);\nprint(bag.includes('Shield'));\nprint(bag.slice(0, 2));\nprint(bag.pop());\nprint(bag);\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"17\">Run example ▶\u003c/button>\u003ciframe title=\"Arrays and basic methods result\" id=\"demo-17\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>map, filter, find, and reduce\u003c/h3>\u003cp>map transforms each item into a new array. filter keeps matching items. find returns the first match or undefined. reduce combines items into a result.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const points = [20, 50, 80];\nprint(points.map(n =&gt; n + 10));\nprint(points.filter(n =&gt; n &gt;= 50));\nprint(points.find(n =&gt; n &gt; 40));\nprint(points.reduce((total, n) =&gt; total + n, 0));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"18\">Run example ▶\u003c/button>\u003ciframe title=\"map, filter, find, and reduce result\" id=\"demo-18\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Sorting and mutation\u003c/h3>\u003cp>sort() mutates its array and defaults to string-based ordering. Supply a numeric comparator for numbers. Copy first when the original order should stay unchanged.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const scores = [80, 5, 100];\nconst ranked = [...scores].sort((a, b) =&gt; b - a);\nprint(ranked);\nprint(scores);\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"19\">Run example ▶\u003c/button>\u003ciframe title=\"Sorting and mutation result\" id=\"demo-19\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Objects, properties, and methods\u003c/h3>\u003cp>Objects group named properties. Use dot notation for a known key and brackets for a dynamic key. A method is a function property. In this direct method call, this refers to the dragon object.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const dragon = {\n  name: 'Chilli',\n  power: 90,\n  roar() { return this.name + ' says ROAR!'; }\n};\nconst key = 'power';\nprint(dragon.name);\nprint(dragon[key]);\nprint(dragon.roar());\nprint(Object.keys(dragon));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"20\">Run example ▶\u003c/button>\u003ciframe title=\"Objects, properties, and methods result\" id=\"demo-20\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Destructuring, spread, rest, and optional chaining\u003c/h3>\u003cp>Destructuring extracts values. Spread expands an array or copies properties. Rest collects remaining values. ?. safely stops when the value before it is null or undefined.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const dragon = { name: 'Chilli', power: 90 };\nconst { name, power } = dragon;\nconst upgraded = { ...dragon, power: power + 10 };\nconst [first, ...others] = ['Fire', 'Ice', 'Storm'];\nprint(name);\nprint(upgraded);\nprint(others);\nprint(dragon.owner?.name ?? 'No owner yet');\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"21\">Run example ▶\u003c/button>\u003ciframe title=\"Destructuring, spread, rest, and optional chaining result\" id=\"demo-21\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003cp class=\"tip\">Spread makes a shallow copy; nested objects can still be shared.\u003c/p>\u003c/article>\u003carticle>\u003ch3>Classes and instances\u003c/h3>\u003cp>A class is syntax for constructing objects with shared prototype methods. constructor initializes an instance. new creates an instance. extends and super support inheritance when that relationship is useful.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>class Dragon {\n  constructor(name) { this.name = name; }\n  fly() { return this.name + ' takes flight!'; }\n}\nconst chilli = new Dragon('Chilli');\nprint(chilli.fly());\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"22\">Run example ▶\u003c/button>\u003ciframe title=\"Classes and instances result\" id=\"demo-22\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>JSON\u003c/h3>\u003cp>JSON is a text data format. JSON.stringify() serializes compatible data; JSON.parse() reads it back. JSON uses double-quoted keys and strings and cannot represent functions, undefined, or BigInt directly.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const saved = JSON.stringify({ dragon: 'Chilli', level: 3 });\nprint(saved);\nconst restored = JSON.parse(saved);\nprint(restored.dragon);\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"23\">Run example ▶\u003c/button>\u003ciframe title=\"JSON result\" id=\"demo-23\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003c/section>\u003csection id=\"topic-5\">\u003ch2>6. Bring the page to life ⚡\u003c/h2>\u003carticle>\u003ch3>DOM selection and text updates\u003c/h3>\u003cp>The DOM is the browser’s object representation of HTML. querySelector finds the first match; querySelectorAll returns a static collection of matches. textContent updates plain text safely.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">HTML\u003c/div>\u003cpre>\u003ccode>&lt;p id=&quot;message&quot;&gt;Waiting for a dragon…&lt;/p&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const message = document.querySelector('#message');\nmessage.textContent = 'Chilli is ready to fly!';\nmessage.classList.add('ready');\nprint(document.querySelectorAll('p').length);\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"24\">Run example ▶\u003c/button>\u003ciframe title=\"DOM selection and text updates result\" id=\"demo-24\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003cp class=\"tip\">Use textContent for untrusted text. innerHTML parses markup and must not receive unsanitized untrusted content.\u003c/p>\u003c/article>\u003carticle>\u003ch3>Create, append, remove, and classList\u003c/h3>\u003cp>createElement makes an element. append inserts it. remove deletes it from the DOM. classList adds, removes, or toggles CSS classes without replacing every class.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">HTML\u003c/div>\u003cpre>\u003ccode>&lt;ul id=&quot;inventory&quot;&gt;&lt;li&gt;Shield&lt;/li&gt;&lt;/ul&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre
