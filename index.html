>\u003ccode>const list = document.querySelector('#inventory');\nconst item = document.createElement('li');\nitem.textContent = 'Fireproof helmet';\nlist.append(item);\nitem.classList.add('ready');\nprint('Inventory updated.');\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"25\">Run example ▶\u003c/button>\u003ciframe title=\"Create, append, remove, and classList result\" id=\"demo-25\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Events and addEventListener\u003c/h3>\u003cp>An event listener reacts to an action. The callback runs when the event occurs, not when it is registered. Run the example, then press the button.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">HTML\u003c/div>\u003cpre>\u003ccode>&lt;button id=&quot;fly&quot;&gt;Fly 🐉&lt;/button&gt;&lt;p id=&quot;flights&quot;&gt;Flights: 0&lt;/p&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>let flights = 0;\ndocument.querySelector('#fly').addEventListener('click', () =&gt; {\n  flights++;\n  document.querySelector('#flights').textContent = 'Flights: ' + flights;\n});\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"26\">Run example ▶\u003c/button>\u003ciframe title=\"Events and addEventListener result\" id=\"demo-26\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Event bubbling and delegation\u003c/h3>\u003cp>Many events bubble from their target through ancestors. Delegation attaches one listener to a parent and checks which child was activated. currentTarget is the listener’s element; target is where the event originated.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">HTML\u003c/div>\u003cpre>\u003ccode>&lt;div id=&quot;skills&quot;&gt;&lt;button data-skill=&quot;Flying selected&quot;&gt;Flying&lt;/button&gt; &lt;button data-skill=&quot;Healing selected&quot;&gt;Healing&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;chosen&quot;&gt;Choose a skill.&lt;/p&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>document.querySelector('#skills').addEventListener('click', event =&gt; {\n  const button = event.target.closest('button');\n  if (!button) return;\n  document.querySelector('#chosen').textContent = button.dataset.skill;\n});\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"27\">Run example ▶\u003c/button>\u003ciframe title=\"Event bubbling and delegation result\" id=\"demo-27\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Forms, input, and preventDefault\u003c/h3>\u003cp>Input values usually arrive as strings. Convert them explicitly when calculating. preventDefault stops the form’s normal navigation/submission. Browser validation helps users; a real server must also validate submissions.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">HTML\u003c/div>\u003cpre>\u003ccode>&lt;form&gt;&lt;label&gt;Trainer name &lt;input id=&quot;trainer&quot; required&gt;&lt;/label&gt; &lt;button&gt;Join academy&lt;/button&gt;&lt;/form&gt;&lt;p id=&quot;greeting&quot;&gt;&lt;/p&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>document.querySelector('form').addEventListener('submit', event =&gt; {\n  event.preventDefault();\n  const name = document.querySelector('#trainer').value.trim();\n  document.querySelector('#greeting').textContent = 'Welcome, ' + name + '!';\n});\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"28\">Run example ▶\u003c/button>\u003ciframe title=\"Forms, input, and preventDefault result\" id=\"demo-28\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Live input and numeric values\u003c/h3>\u003cp>The input event fires as a control’s value changes. valueAsNumber reads numeric input as a number and may return NaN for invalid or empty values.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">HTML\u003c/div>\u003cpre>\u003ccode>&lt;label&gt;Volume &lt;input id=&quot;volume&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;/label&gt;&lt;p id=&quot;level&quot;&gt;Roar volume: 50&lt;/p&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const range = document.querySelector('#volume');\nconst label = document.querySelector('#level');\nrange.addEventListener('input', () =&gt; {\n  label.textContent = 'Roar volume: ' + range.valueAsNumber;\n});\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"29\">Run example ▶\u003c/button>\u003ciframe title=\"Live input and numeric values result\" id=\"demo-29\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003c/section>\u003csection id=\"topic-6\">\u003ch2>7. Wait without freezing the academy ⏳\u003c/h2>\u003carticle>\u003ch3>Timers and the event loop\u003c/h3>\u003cp>setTimeout schedules a callback after at least the specified delay; it does not pause the current script. Its timing is not exact. setInterval repeats callbacks; clearTimeout and clearInterval cancel scheduled work.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>print('1. Start training');\nsetTimeout(() =&gt; print('3. Dragon landed!'), 700);\nprint('2. Continue other work');\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"30\">Run example ▶\u003c/button>\u003ciframe title=\"Timers and the event loop result\" id=\"demo-30\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Promises\u003c/h3>\u003cp>A Promise represents eventual fulfillment or rejection. then handles success, catch handles rejection, and finally runs after settlement. This example simulates a short wait without a network request.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const lesson = new Promise(resolve =&gt; {\n  setTimeout(() =&gt; resolve('Flying badge unlocked!'), 500);\n});\nlesson.then(message =&gt; print(message));\nprint('Waiting for the lesson…');\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"31\">Run example ▶\u003c/button>\u003ciframe title=\"Promises result\" id=\"demo-31\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>async, await, and try/catch\u003c/h3>\u003cp>An async function returns a Promise. await pauses that function until the value settles; it does not block the whole page. try/catch handles thrown errors and awaited rejections.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>async function train() {\n  try {\n    const badge = await Promise.resolve('Fire safety badge');\n    print(badge);\n  } catch (error) {\n    print(error.message);\n  } finally {\n    print('Lesson finished.');\n  }\n}\ntrain();\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"32\">Run example ▶\u003c/button>\u003ciframe title=\"async, await, and try/catch result\" id=\"demo-32\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>fetch and HTTP errors\u003c/h3>\u003cp>fetch requests a resource and returns a Promise. HTTP error responses such as 404 do not automatically reject: check response.ok. Reading JSON is asynchronous too. This is a reference example; it needs a real endpoint and is not run offline.\u003c/p>\u003cdiv class=\"\">\u003cdiv>\u003cdiv class=\"label\">REFERENCE CODE\u003c/div>\u003cpre>\u003ccode>async function loadDragons() {\n  try {\n    const response = await fetch('/api/dragons');\n    if (!response.ok) throw new Error('HTTP ' + response.status);\n    const dragons = await response.json();\n    console.log(dragons);\n  } catch (error) {\n    console.error('Could not load dragons:', error.message);\n  }\n}\nloadDragons();\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003cp class=\"tip\">Cross-origin requests depend on the server’s CORS policy. Never put private API keys in browser JavaScript.\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"topic-7\">\u003ch2>8. Save, organize, and debug 🧰\u003c/h2>\u003carticle>\u003ch3>localStorage and sessionStorage\u003c/h3>\u003cp>Both store strings by origin. localStorage normally persists between sessions; sessionStorage is tied to a tab’s session. Serialize objects with JSON. Storage may be unavailable or full; local-file behavior varies, so this example is reference-only.\u003c/p>\u003cdiv class=\"\">\u003cdiv>\u003cdiv class=\"label\">REFERENCE CODE\u003c/div>\u003cpre>\u003ccode>try {\n  localStorage.setItem('dragon', JSON.stringify({ name: 'Chilli' }));\n  const raw = localStorage.getItem('dragon');\n  const dragon = raw ? JSON.parse(raw) : null;\n  console.log(dragon?.name);\n  localStorage.removeItem('dragon');\n} catch (error) {\n  console.error('Storage unavailable:', error.message);\n}\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003cp class=\"tip\">Do not treat browser storage as secure storage for passwords or sensitive secrets.\u003c/p>\u003c/article>\u003carticle>\u003ch3>Modules: export and import\u003c/h3>\u003cp>Modules split code into reusable files and run in strict mode. Load browser modules with type=&quot;module&quot;. Serve module examples over a local HTTP server rather than relying on file:// behavior.\u003c/p>\u003cdiv class=\"\">\u003cdiv>\u003cdiv class=\"label\">REFERENCE CODE\u003c/div>\u003cpre>\u003ccode>// dragon.js\nexport function roar() { return 'ROAAAR!'; }\n\n// app.js\nimport { roar } from './dragon.js';\nconsole.log(roar());\n\n// HTML:\n// &lt;script type=&quot;module&quot; src=&quot;app.js&quot;&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Errors and debugging\u003c/h3>\u003cp>Syntax errors prevent parsing. Reference errors often mean an unknown variable. Type errors often mean an operation is invalid for a value. Use developer tools, console.log(), breakpoints, and the call stack to inspect behavior.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>try {\n  const dragon = null;\n  print(dragon.name);\n} catch (error) {\n  print(error.name);\n  print('Caught the mistake; the program can continue.');\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"36\">Run example ▶\u003c/button>\u003ciframe title=\"Errors and debugging result\" id=\"demo-36\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003c/article>\u003carticle>\u003ch3>Regular expressions\u003c/h3>\u003cp>A regular expression describes a text pattern. test() checks for a match; replace() can substitute matches. Flags such as i ignore case and g match globally.\u003c/p>\u003cdiv class=\"pair\">\u003cdiv>\u003cdiv class=\"label\">JAVASCRIPT\u003c/div>\u003cpre>\u003ccode>const dragonName = 'Chilli42';\nprint(/^[a-z]+\\d*$/i.test(dragonName));\nprint('fire fire ice'.replace(/fire/g, '🔥'));\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">LIVE RESULT\u003c/div>\u003cbutton class=\"run\" type=\"button\" data-run=\"37\">Run example ▶\u003c/button>\u003ciframe title=\"Regular expressions result\" id=\"demo-37\" sandbox=\"allow-scripts\" srcdoc=\"\u003cp>Press Run example to begin.\u003c/p>\">\u003c/iframe>\u003c/div>\u003c/div>\u003cp class=\"tip\">Simple patterns are useful, but do not invent a tiny regex and assume it validates every real email address.\u003c/p>\u003c/article>\u003c/section>\u003csection>\u003ch2>Final boss: count dragon flights 🐲\u003c/h2>\u003cp>Make a button add one to a visible flight count. Use a variable, an event listener, and textContent.\u003c/p>\u003cdetails>\u003csummary>Reveal one solution\u003c/summary>\u003cpre>\u003ccode>&lt;button id=&quot;fly&quot;&gt;Fly&lt;/button&gt;\n&lt;p id=&quot;count&quot;&gt;0&lt;/p&gt;\n&lt;script&gt;\nlet flights = 0;\ndocument.querySelector('#fly').addEventListener('click', () =&gt; {\n  flights++;\n  document.querySelector('#count').textContent = flights;\n});\n&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/details>\u003ch3>Memory shortcut\u003c/h3>\u003cp>Variable = a named value. Function = a reusable action. Object = related data and behavior. Event = something happened. DOM = the page you can change. Promise = a future result.\u003c/p>\u003c/section>\u003c/main>\u003cfooter>All runnable examples work offline. print() belongs to this guide; use console.log() or DOM updates in your own projects.\u003c/footer>\u003cscript>\nconst examples = [{\"code\":\"print('Welcome to Dragon Academy!');\\nconsole.log('Also visible in developer tools.');\",\"markup\":\"\",\"live\":true},{\"code\":\"\\u003c!-- In your HTML: -->\\n\\u003cscript src=\\\"academy.js\\\" defer>\\u003c/script>\\n\\u003c!-- Or: -->\\n\\u003cscript>console.log('Academy open!');\\u003c/script>\",\"markup\":\"\",\"live\":false},{\"code\":\"// Announce the lesson.\\nprint('Flying starts at 9 AM.');\\n/* Comments are ignored by the program. */\",\"markup\":\"\",\"live\":true},{\"code\":\"const dragon = 'Chilli';\\nlet points = 10;\\npoints += 5;\\nprint(dragon + ': ' + points + ' points');\",\"markup\":\"\",\"live\":true},{\"code\":\"print(typeof 'Chilli');\\nprint(typeof 42);\\nprint(typeof true);\\nlet unknown;\\nprint(typeof unknown);\\nprint(typeof null);\\nprint(typeof 10n);\\nprint(typeof Symbol('id'));\\nprint(Array.isArray(['Fire', 'Ice']));\",\"markup\":\"\",\"live\":true},{\"code\":\"let coins = 20;\\ncoins += 5;\\nprint(coins);\\nprint(10 % 3);\\nprint(2 ** 3);\\nprint((4 + 2) * 3);\",\"markup\":\"\",\"live\":true},{\"code\":\"print(5 === '5');\\nprint(5 == '5'); // Coercion: true\\nconst age = 18;\\nconst hasHelmet = true;\\nprint(age >= 16 && hasHelmet);\\nprint(!hasHelmet);\",\"markup\":\"\",\"live\":true},{\"code\":\"print(Number('25') + 5);\\nprint(Boolean('false')); // Nonempty string: true\\nprint(Boolean([]));\\nprint(0 || 10);\\nprint(0 ?? 10);\\nprint(Number.isNaN(Number('dragon')));\",\"markup\":\"\",\"live\":true},{\"code\":\"const name = 'Chilli';\\nprint(`Hello, ${name}!`);\\nprint(name.toUpperCase());\\nprint('  Fire  '.trim());\\nprint('Dragon Academy'.includes('Academy'));\\nprint(name.slice(0, 3));\",\"markup\":\"\",\"live\":true},{\"code\":\"print(Math.round(4.7));\\nprint(Math.max(10, 25, 8));\\nprint(Math.floor(Math.random() * 6) + 1);\\nconst lesson = new Date(2026, 8, 13);\\nprint(lesson.toLocaleDateString());\\nprint((0.1 + 0.2).toFixed(2));\",\"markup\":\"\",\"live\":true},{\"code\":\"const score = 75;\\nif (score >= 90) {\\n  print('Master trainer');\\n} else if (score >= 60) {\\n  print('Ready to fly');\\n} else {\\n  print('More practice needed');\\n}\",\"markup\":\"\",\"live\":true},{\"code\":\"const hasHelmet = true;\\nprint(hasHelmet ? 'Board the dragon' : 'Get a helmet');\\nconst element = 'ice';\\nswitch (element) {\\n  case 'fire': print('Bring water'); break;\\n  case 'ice': print('Bring a coat'); break;\\n  default: print('Bring a shield');\\n}\",\"markup\":\"\",\"live\":true},{\"code\":\"for (let lap = 1; lap \\u003c= 3; lap++) {\\n  print('Flying lap ' + lap);\\n}\\nlet energy = 2;\\nwhile (energy > 0) {\\n  print('Energy: ' + energy);\\n  energy--;\\n}\\ndo { print('At least one greeting!'); } while (false);\",\"markup\":\"\",\"live\":true},{\"code\":\"for (const skill of ['Flying', 'Sleeping', 'Healing']) {\\n  if (skill === 'Sleeping') continue;\\n  print(skill);\\n}\\nconst stats = { speed: 80, power: 90 };\\nfor (const key of Object.keys(stats)) {\\n  print(key + ': ' + stats[key]);\\n}\\nfor (let n = 1; n \\u003c= 5; n++) {\\n  if (n === 3) break;\\n  print(n);\\n}\",\"markup\":\"\",\"live\":true},{\"code\":\"function feedDragon(name, portions = 1) {\\n  return name + ' ate ' + portions + ' portions.';\\n}\\nprint(feedDragon('Chilli', 3));\\nprint(feedDragon('Frosty'));\",\"markup\":\"\",\"live\":true},{\"code\":\"const double = number => number * 2;\\nfunction reward(points, transform) {\\n  return transform(points);\\n}\\nprint(reward(10, double));\\nprint([1, 2, 3].map(n => n * 3));\",\"markup\":\"\",\"live\":true},{\"code\":\"function createCounter() {\\n  let count = 0;\\n  return function () {\\n    count++;\\n    return count;\\n  };\\n}\\nconst countFlights = createCounter();\\nprint(countFlights());\\nprint(countFlights());\",\"markup\":\"\",\"live\":true},{\"code\":\"const bag = ['Helmet', 'Shield'];\\nbag.push('Snacks');\\nprint(bag[0]);\\nprint(bag.length);\\nprint(bag.includes('Shield'));\\nprint(bag.slice(0, 2));\\nprint(bag.pop());\\nprint(bag);\",\"markup\":\"\",\"live\":true},{\"code\":\"const points = [20, 50, 80];\\nprint(points.map(n => n + 10));\\nprint(points.filter(n => n >= 50));\\nprint(points.find(n => n > 40));\\nprint(points.reduce((total, n) => total + n, 0));\",\"markup\":\"\",\"live\":true},{\"code\":\"const scores = [80, 5, 100];\\nconst ranked = [...scores].sort((a, b) => b - a);\\nprint(ranked);\\nprint(scores);\",\"markup\":\"\",\"live\":true},{\"code\":\"const dragon = {\\n  name: 'Chilli',\\n  power: 90,\\n  roar() { return this.name + ' says ROAR!'; }\\n};\\nconst key = 'power';\\nprint(dragon.name);\\nprint(dragon[key]);\\nprint(dragon.roar());\\nprint(Object.keys(dragon));\",\"markup\":\"\",\"live\":true},{\"code\":\"const dragon = { name: 'Chilli', power: 90 };\\nconst { name, power } = dragon;\\nconst upgraded = { ...dragon, power: power + 10 };\\nconst [first, ...others] = ['Fire', 'Ice', 'Storm'];\\nprint(name);\\nprint(upgraded);\\nprint(others);\\nprint(dragon.owner?.name ?? 'No owner yet');\",\"markup\":\"\",\"live\":true},{\"code\":\"class Dragon {\\n  constructor(name) { this.name = name; }\\n  fly() { return this.name + ' takes flight!'; }\\n}\\nconst chilli = new Dragon('Chilli');\\nprint(chilli.fly());\",\"markup\":\"\",\"live\":true},{\"code\":\"const saved = JSON.stringify({ dragon: 'Chilli', level: 3 });\\nprint(saved);\\nconst restored = JSON.parse(saved);\\nprint(restored.dragon);\",\"markup\":\"\",\"live\":true},{\"code\":\"const message = document.querySelector('#message');\\nmessage.textContent = 'Chilli is ready to fly!';\\nmessage.classList.add('ready');\\nprint(document.querySelectorAll('p').length);\",\"markup\":\"\\u003cp id=\\\"message\\\">Waiting for a dragon…\\u003c/p>\",\"live\":true},{\"code\":\"const list = document.querySelector('#inventory');\\nconst item = document.createElement('li');\\nitem.textContent = 'Fireproof helmet';\\nlist.append(item);\\nitem.classList.add('ready');\\nprint('Inventory updated.');\",\"m
